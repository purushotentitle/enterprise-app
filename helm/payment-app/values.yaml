# Default values for payment-app
# High-Availability production configuration for GCP GKE

environment: "prod"

replicaCount: 3

image:
  repository: us-central1-docker.pkg.dev/my-gcp-project/payment-app-repo/payment-app
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "payment-service"

serviceAccount:
  create: true
  annotations:
    iam.gke.io/gcp-service-account: "payment-workload-sa@my-gcp-project.iam.gserviceaccount.com"
  name: "payment-service-sa"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/actuator/prometheus"
  prometheus.io/port: "8080"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  capabilities:
    drop:
      - ALL

# JVM & Application Environment Variables
env:
  SPRING_PROFILES_ACTIVE: "prod"
  JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
  SERVER_PORT: "8080"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-cluster:9092"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://10.10.0.15:5432/paymentdb"
  SPRING_DATASOURCE_USERNAME: "payment_user"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

secretEnv:
  SPRING_DATASOURCE_PASSWORD:
    secretName: "payment-db-secret"
    secretKey: "password"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  actuatorPort: 8080
  annotations:
    cloud.google.com/backend-config: '{"default": "payment-backend-config"}'
    cloud.google.com/neg: '{"ingress": true}' # Network Endpoint Groups for direct container routing

ingress:
  enabled: true
  className: "nginx" # Or "gce" for Google Cloud Load Balancer
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: payment.example.com
      paths:
        - path: /
          pathType: Prefix
          port: 80
  tls:
    - secretName: payment-tls-cert
      hosts:
        - payment.example.com

# Resource allocations tuned for Java 17 + Spring Boot 3
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 1024Mi

# Probes mapped to Spring Boot Actuator health endpoints
probes:
  startup:
    enabled: true
    httpGet:
      path: /actuator/health/liveness
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 5
    failureThreshold: 20
  liveness:
    enabled: true
    httpGet:
      path: /actuator/health/liveness
      port: 8080
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /actuator/health/readiness
      port: 8080
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2

# Rolling Update Strategy for Zero Downtime
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 0

# Graceful Shutdown
lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "sleep 15"]
terminationGracePeriodSeconds: 60

# Pod Disruption Budget guarantees minimum quorum during node upgrades / maintenance
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Horizontal Pod Autoscaling
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15

# Pod Anti-Affinity & Multi-Zone Topology Spread for High Availability
podAntiAffinity:
  enabled: true
  type: preferred # preferred or required
  topologyKey: "topology.kubernetes.io/zone"

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: "topology.kubernetes.io/zone"
  whenUnsatisfiable: "DoNotSchedule"

# GCP Cloud Armor & BackendConfig
backendConfig:
  enabled: true
  name: "payment-backend-config"
  cloudArmorPolicy: "prod-payment-app-waf-policy"
  timeoutSec: 30
  connectionDraining:
    drainingTimeoutSec: 60
  healthCheck:
    requestPath: "/actuator/health/liveness"
    port: 8080

# Prometheus Operator ServiceMonitor
serviceMonitor:
  enabled: true
  namespace: "monitoring"
  interval: "15s"
  path: "/actuator/prometheus"

# Zero-Trust Network Policy
networkPolicy:
  enabled: true
  allowIngressFromNamespaces:
    - "ingress-nginx"
    - "monitoring"

tmpVolume:
  enabled: true
  sizeLimit: "256Mi"
